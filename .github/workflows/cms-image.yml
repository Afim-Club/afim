# Builds the CMS image and publishes it to GitHub Container Registry
# (ghcr.io/afim-club/afim-cms), used by the Dockge stack in infra/dockge/.
name: CMS image

on:
  push:
    branches: [main]
    paths: [cms/**, .github/workflows/cms-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cms
          push: true
          tags: |
            ghcr.io/afim-club/afim-cms:latest
            ghcr.io/afim-club/afim-cms:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
