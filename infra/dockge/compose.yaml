# Strapi (cms/) as a Dockge stack, using an existing MySQL 8 / MariaDB database
# (e.g. a managed MySQL on the same cloud network); no database container.
# In Dockge: create a stack named "afim-cms", paste this file, and fill the
# ".env" tab from .env.example next to it. The image is published to GHCR by
# .github/workflows/cms-image.yml on every push to main; Update pulls it.
services:
  cms:
    image: ghcr.io/afim-club/afim-cms:${CMS_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-1337}:1337"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "1337"
      PROXY: "true"
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WEB_URL: ${WEB_URL}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DATABASE_NAME: ${DATABASE_NAME:-afim}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-afim}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      SEED: ${SEED:-false}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SUBMIT_RATE_MAX: ${SUBMIT_RATE_MAX:-5}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_FACEBOOK_CLIENT_ID: ${AUTH_FACEBOOK_CLIENT_ID:-}
      AUTH_FACEBOOK_CLIENT_SECRET: ${AUTH_FACEBOOK_CLIENT_SECRET:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_LINKEDIN_CLIENT_ID: ${AUTH_LINKEDIN_CLIENT_ID:-}
      AUTH_LINKEDIN_CLIENT_SECRET: ${AUTH_LINKEDIN_CLIENT_SECRET:-}
    volumes:
      # Media uploaded through the admin panel (local upload provider).
      - uploads:/app/public/uploads

volumes:
  uploads:
