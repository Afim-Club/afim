# Docker Swarm stack. Deploy with:
#   set -a; . ./.env; set +a   # DOMAIN, TAG, REGISTRY, ACME_EMAIL and the secrets in .env.example
#   docker stack deploy -c infra/stack.yml afim
# Prerequisite (once): docker network create --driver overlay --attachable proxy
version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - { target: 80, published: 80, mode: host }
      - { target: 443, published: 443, mode: host }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [proxy]
    deploy:
      placement:
        constraints: [node.role == manager]

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USERNAME}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.db == true]

  cms:
    image: ${REGISTRY}/afim-cms:${TAG}
    environment:
      NODE_ENV: production
      PROXY: "true"
      PUBLIC_URL: https://dash.${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN},https://partners.${DOMAIN}
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mariadb
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SUBMIT_RATE_MAX: ${SUBMIT_RATE_MAX:-5}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      WEB_URL: https://${DOMAIN}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_FACEBOOK_CLIENT_ID: ${AUTH_FACEBOOK_CLIENT_ID:-}
      AUTH_FACEBOOK_CLIENT_SECRET: ${AUTH_FACEBOOK_CLIENT_SECRET:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_LINKEDIN_CLIENT_ID: ${AUTH_LINKEDIN_CLIENT_ID:-}
      AUTH_LINKEDIN_CLIENT_SECRET: ${AUTH_LINKEDIN_CLIENT_SECRET:-}
    networks: [proxy, backend]
    deploy:
      replicas: 2
      update_config: { order: start-first, failure_action: rollback }
      rollback_config: { order: start-first }
      labels:
        - traefik.enable=true
        - traefik.http.routers.cms.rule=Host(`dash.${DOMAIN}`)
        - traefik.http.routers.cms.entrypoints=websecure
        - traefik.http.routers.cms.tls.certresolver=le
        - traefik.http.services.cms.loadbalancer.server.port=1337
        - traefik.docker.network=proxy

  web:
    image: ${REGISTRY}/afim-web:${TAG}
    networks: [proxy]
    deploy:
      replicas: 2
      update_config: { order: start-first, failure_action: rollback }
      rollback_config: { order: start-first }
      labels:
        - traefik.enable=true
        - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.web.entrypoints=websecure
        - traefik.http.routers.web.tls.certresolver=le
        - traefik.http.services.web.loadbalancer.server.port=80
        - traefik.docker.network=proxy

  partners:
    image: ${REGISTRY}/afim-partners:${TAG}
    networks: [proxy]
    deploy:
      replicas: 2
      update_config: { order: start-first, failure_action: rollback }
      rollback_config: { order: start-first }
      labels:
        - traefik.enable=true
        - traefik.http.routers.partners.rule=Host(`partners.${DOMAIN}`)
        - traefik.http.routers.partners.entrypoints=websecure
        - traefik.http.routers.partners.tls.certresolver=le
        - traefik.http.services.partners.loadbalancer.server.port=80
        - traefik.docker.network=proxy

networks:
  proxy:
    external: true
  backend:
    driver: overlay

volumes:
  letsencrypt:
  mariadb-data:
