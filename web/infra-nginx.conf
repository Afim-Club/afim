server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Old directory URLs moved under /explorar (same rules as public/_redirects).
  rewrite ^/(categorias|perfis)/(.*)$ /explorar/$1/$2 permanent;
  rewrite ^/(estados|mapa|busca)/?$ /explorar/$1 permanent;
  rewrite ^/(ac|al|ap|am|ba|ce|df|es|go|ma|mt|ms|mg|pa|pb|pr|pe|pi|rj|rn|rs|ro|rr|sc|sp|se|to)(/.*)?$ /explorar/$1$2 permanent;
  location / { try_files $uri $uri/ =404; }
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
